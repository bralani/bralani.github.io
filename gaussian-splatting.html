<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gaussian Splatting</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #application-canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #loading {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      color: #a7ffeb; font-family: sans-serif; font-size: 1.2rem;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="application-canvas"></canvas>
  <div id="loading">Loading…</div>
  <script src="https://cdn.jsdelivr.net/npm/playcanvas@2/build/playcanvas.min.js"></script>
  <script>
    const canvas = document.getElementById('application-canvas');
    const app = new pc.Application(canvas, {
      mouse: new pc.Mouse(canvas),
      touch: new pc.TouchDevice(canvas)
    });
    app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
    app.setCanvasResolution(pc.RESOLUTION_AUTO);
    window.addEventListener('resize', () => app.resizeCanvas());

    // Camera
    const cameraEntity = new pc.Entity('camera');
    cameraEntity.addComponent('camera', { clearColor: new pc.Color(0, 0, 0) });
    app.root.addChild(cameraEntity);

    // Orbit camera state
    let yaw = 0;
    let pitch = 0;
    let distance = 3;
    const pivot = new pc.Vec3(0, 0, 0);

    // Mouse state
    let lastX = 0, lastY = 0;
    let mouseButton = -1;

    canvas.addEventListener('mousedown', (e) => {
      mouseButton = e.button;
      lastX = e.clientX;
      lastY = e.clientY;
      e.preventDefault();
    });

    canvas.addEventListener('mouseup', () => { mouseButton = -1; });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    canvas.addEventListener('mousemove', (e) => {
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;

      if (mouseButton === 0) {
        // Left drag: orbit
        yaw -= dx * 0.3;
        pitch -= dy * 0.3;
        pitch = Math.max(-89, Math.min(89, pitch));
      } else if (mouseButton === 1 || mouseButton === 2) {
        // Middle or right drag: pan
        const right = new pc.Vec3();
        const up = new pc.Vec3();
        cameraEntity.getWorldTransform().getX(right);
        cameraEntity.getWorldTransform().getY(up);
        right.scale(-dx * 0.002 * distance);
        up.scale(dy * 0.002 * distance);
        pivot.add(right);
        pivot.add(up);
      }
    });

    canvas.addEventListener('wheel', (e) => {
      distance *= 1 + e.deltaY * 0.001;
      distance = Math.max(0.1, Math.min(100, distance));
      e.preventDefault();
    }, { passive: false });

    // Touch support
    let touches = [];
    let lastPinchDist = 0;

    canvas.addEventListener('touchstart', (e) => {
      touches = Array.from(e.touches);
      if (touches.length === 2) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        lastPinchDist = Math.sqrt(dx * dx + dy * dy);
      }
      lastX = touches[0].clientX;
      lastY = touches[0].clientY;
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      const currentTouches = Array.from(e.touches);

      if (currentTouches.length === 1) {
        const dx = currentTouches[0].clientX - lastX;
        const dy = currentTouches[0].clientY - lastY;
        yaw -= dx * 0.3;
        pitch -= dy * 0.3;
        pitch = Math.max(-89, Math.min(89, pitch));
        lastX = currentTouches[0].clientX;
        lastY = currentTouches[0].clientY;
      } else if (currentTouches.length === 2) {
        const dx = currentTouches[0].clientX - currentTouches[1].clientX;
        const dy = currentTouches[0].clientY - currentTouches[1].clientY;
        const pinchDist = Math.sqrt(dx * dx + dy * dy);
        const delta = lastPinchDist - pinchDist;
        distance *= 1 + delta * 0.005;
        distance = Math.max(0.1, Math.min(100, distance));
        lastPinchDist = pinchDist;
      }
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      touches = Array.from(e.touches);
      if (touches.length > 0) {
        lastX = touches[0].clientX;
        lastY = touches[0].clientY;
      }
    });

    // Update camera each frame
    app.on('update', () => {
      const yawRad = yaw * pc.math.DEG_TO_RAD;
      const pitchRad = pitch * pc.math.DEG_TO_RAD;

      const x = distance * Math.cos(pitchRad) * Math.sin(yawRad);
      const y = distance * Math.sin(pitchRad);
      const z = distance * Math.cos(pitchRad) * Math.cos(yawRad);

      cameraEntity.setPosition(pivot.x + x, pivot.y + y, pivot.z + z);
      cameraEntity.lookAt(pivot);
    });

    // Load splat
    app.assets.loadFromUrl('https://huggingface.co/kishimisu/3d-gaussian-splatting-webgl/resolve/main/building.ply', 'gsplat', (err, asset) => {
      document.getElementById('loading').style.display = 'none';
      if (err) {
        console.error('Failed to load splat:', err);
        return;
      }
      const splatEntity = new pc.Entity('splat');
      splatEntity.addComponent('gsplat', { asset: asset });
      app.root.addChild(splatEntity);
    });

    app.start();
  </script>
</body>
</html>
